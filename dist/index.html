<title>Прожить жизнь</title>

<style>
/* Колода жизни, спокойная версия: сцена — большая карта на тёмном столе, поступки — четыре карты-бумаги.
   Стол почти без цвета, один тёплый акцент (главная кнопка, текущий возраст, перевёрнутая черта).
   Стороны жизни различаются значком и словом; цвет у значка приглушённый. Один облик для обеих тем.
   Шрифт один — Onest (сделан с кириллицей): заголовки плотнее и с узкой трекинговой разрядкой, подписи без капса. */
:root {
  color-scheme: dark;
  --table: #1a2427;        /* стол: вода в сумерках, почти без цвета */
  --table-hi: #253338;
  --table-deep: #141c1f;
  --table-ink: #e9edeb;
  --table-dim: #9eaeac;
  --table-mid: #6f817f;
  --table-line: #2f3d41;
  --card: #f7f3ec;         /* лицо карты: бумага */
  --card-2: #ede7dc;
  --card-3: #d9d1c3;
  --line: #e1d9cb;
  --ink: #23282a;
  --ink-dim: #5f6769;
  --accent: #e0b25e;       /* единственный акцент */
  --accent-deep: #a98238;
  --accent-ink: #2a2012;
  --accent-hi: #f2deb0;
  --danger: #f0a493;
  /* стороны жизни: приглушённые тона только для значков; тёмный — на бумаге, светлый — на столе */
  --home: #a86a40;  --home-hi: #d4a681;
  --road: #3f8178;  --road-hi: #8fbfb7;
  --work: #5a72a0;  --work-hi: #a7b6d6;
  --close: #a05a72; --close-hi: #d3a1b3;
  --shade: rgba(5, 10, 12, .38);
  --silhouette: rgba(26, 36, 39, .2);
  --silhouette-hi: rgba(158, 174, 172, .45);
  --font-display: 'Onest', 'Segoe UI', Roboto, system-ui, sans-serif;
  --font-body: 'Onest', 'Segoe UI', Roboto, system-ui, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;
  --r-card: 18px;
  --r-small: 10px;
  --lift: 0 1px 0 rgba(0, 0, 0, .12), 0 10px 24px var(--shade);
}
.sp0 { --sp: var(--home);  --sp-hi: var(--home-hi); }
.sp1 { --sp: var(--road);  --sp-hi: var(--road-hi); }
.sp2 { --sp: var(--work);  --sp-hi: var(--work-hi); }
.sp3 { --sp: var(--close); --sp-hi: var(--close-hi); }

* { box-sizing: border-box; }
/* фон страницы задаёт html, у body фон прозрачный: иначе он закрыл бы свечение body::after */
html { -webkit-text-size-adjust: 100%; background: var(--table); }
/* сверху отступ под строку состояния телефона (у игры с экрана «Домой» она поверх страницы) */
body { margin: 0; min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); background: transparent; color: var(--table-ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
p, li { text-wrap: pretty; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--table); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(110% 55% at 50% -12%, var(--table-hi), transparent 62%); }
.wrap { width: 100%; max-width: 76rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: 1.1rem 3rem; }
img { max-width: 100%; }
button { -webkit-tap-highlight-color: transparent; }

/* значки сторон жизни и гексаграммы */
.ico { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.suit { display: inline-flex; align-items: center; gap: .3rem; font-weight: 600; font-size: .82rem; line-height: 1.2; color: var(--ink-dim); }
.suit .ico { color: var(--sp); }
.hex { display: block; width: 1.05rem; height: 1.2rem; flex: none; fill: currentColor; }
.hex .hl { fill: var(--accent-deep); }
.hexno { font-size: .78rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* табло: лицо героя в нужном возрасте, возраст, сколько карт каждой стороны сыграно, полоса жизни */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--table); border-bottom: 1px solid var(--table-line); box-shadow: 0 6px 18px var(--shade); view-transition-name: hud; }
.hud-in { display: flex; align-items: center; gap: .7rem; padding-block: .55rem .45rem; }
/* кольцо прожитой жизни дорастает от прошлого значения (--p0) до нового (--p) */
@property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
.avatar { --p: 0; width: 2.9rem; height: 2.9rem; flex: none; border-radius: 50%; padding: 2px; background: conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--table-line) 0);
  animation: ring .9s .2s cubic-bezier(.2, .8, .2, 1) backwards; }
.avatar .face { width: 100%; height: 100%; margin: 0; border-radius: 50%; overflow: hidden; background: var(--table-deep); border: 2px solid var(--table); view-transition-name: face; }
.age-big { view-transition-name: hud-age; }
.suit-count.bump { animation: bump .6s .35s cubic-bezier(.2, .8, .2, 1) backwards; }
.face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.face.gone img { display: none; }
.face.gone { background: radial-gradient(ellipse 22% 22% at 50% 44%, var(--silhouette-hi) 0 96%, transparent 100%), radial-gradient(ellipse 40% 30% at 50% 104%, var(--silhouette-hi) 0 97%, transparent 100%), var(--table-deep); }
.hud-age { display: flex; flex-direction: column; gap: .1rem; min-width: 0; line-height: 1.1; }
.age-big { font-weight: 650; font-size: 1.15rem; letter-spacing: -.01em; white-space: nowrap; }
.hud-step { font-size: .78rem; color: var(--table-dim); white-space: nowrap; }
.suits { list-style: none; margin: 0 0 0 auto; padding: 0; display: flex; gap: .25rem; }
.suit-count { display: inline-flex; align-items: center; gap: .25rem; padding: .25rem .5rem; border-radius: 99px; border: 1px solid var(--table-line); color: var(--table-dim); font-weight: 600; font-size: .85rem; font-variant-numeric: tabular-nums; }
.suit-count b { color: var(--table-ink); font-weight: 600; }
.track { list-style: none; margin: 0; padding: 0 0 .55rem; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.seg { position: relative; height: 4px; border-radius: 99px; background: var(--table-line); }
.seg.done { background: var(--table-mid); }
.seg.now { background: var(--accent); }
.seg-age { display: none; }
@media (max-width: 25.5rem) {
  .hud-in { gap: .5rem; }
  .avatar { width: 2.6rem; height: 2.6rem; }
  .age-big { font-size: 1.05rem; }
  .hud-step { font-size: .72rem; }
  .suits { gap: .2rem; }
  .suit-count { padding: .22rem .32rem; gap: .14rem; font-size: .8rem; }
}
@media (max-width: 21rem) {
  .avatar { width: 2.3rem; height: 2.3rem; }
  .suit-count { padding: .2rem .24rem; gap: .1rem; }
  .hud-step { font-size: .68rem; overflow: hidden; text-overflow: ellipsis; }
}
@media (min-width: 48rem) {
  .avatar { width: 3.2rem; height: 3.2rem; }
  .age-big { font-size: 1.3rem; }
  .suits { gap: .4rem; }
  .suit-count { padding: .28rem .65rem; }
  .track { padding-bottom: 1.35rem; gap: 4px; }
  .seg-age { display: block; position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: .68rem; color: var(--table-dim); font-variant-numeric: tabular-nums; }
  .seg.now .seg-age { color: var(--accent); font-weight: 700; }
}

/* карты */
.card { background: var(--card); color: var(--ink); border-radius: var(--r-card); box-shadow: var(--lift); overflow: hidden; min-width: 0; }
.card-body { padding: 1.05rem 1.15rem 1.3rem; display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
.card-meta { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: .3rem .55rem; font-size: .85rem; color: var(--ink-dim); }
.card-meta .suit::after { content: "·"; margin-left: .25rem; color: var(--card-3); }
.art { position: relative; margin: 0; aspect-ratio: 3 / 2; max-width: 100%; overflow: hidden; background: linear-gradient(160deg, var(--card-2), var(--card-3)); }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s ease; }
.art.ready img { opacity: 1; }
.art.gone > img:not(.reel-frame) { display: none; }
.art-mark { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sp); opacity: .6; }
.art-mark .ico { width: 3rem; height: 3rem; stroke-width: 1.4; }
.art.ready .art-mark { display: none; }
.scene-title { margin: 0; font-family: var(--font-display); font-weight: 650; font-size: clamp(1.55rem, 1.15rem + 1.7vw, 2.3rem); line-height: 1.12; letter-spacing: -.025em; text-wrap: balance; overflow-wrap: anywhere; }
.prose { display: flex; flex-direction: column; gap: .8rem; font-size: 1.0625rem; line-height: 1.62; }
.prose p { margin: 0; }
.label { margin: 0 0 .4rem; font-size: .84rem; font-weight: 600; color: var(--ink-dim); }
.flashback { padding: .75rem .9rem; border-radius: var(--r-small); background: var(--card-2); }
.flashback p { margin: .15rem 0 0; font-size: .93rem; line-height: 1.45; }
.flashback p::before, .choice-mem::before { content: "↩ "; color: var(--accent-deep); font-weight: 700; }
.cost { align-self: flex-start; margin: 0; padding: .3rem .6rem; border-radius: 8px; background: var(--card-2); color: var(--ink); font-size: .92rem; line-height: 1.4; }
.table-title { margin: 0 0 .6rem; font-weight: 650; font-size: 1.12rem; letter-spacing: -.01em; color: var(--table-ink); }
.table-note { margin: -.3rem 0 .8rem; font-size: .88rem; color: var(--table-dim); }

/* стол сцены: карта сцены и четыре карты поступков */
.board { display: grid; gap: 1.4rem; }
.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.choice { width: 100%; display: grid; grid-template-columns: 2.3rem minmax(0, 1fr); text-align: left; font: inherit; color: var(--ink); border: 0; padding: 0; border-radius: 16px; cursor: pointer; overflow: hidden;
  background: var(--card); box-shadow: var(--lift); transition: transform .18s ease, box-shadow .18s ease, opacity .25s ease; }
.corner { padding: .9rem 0 0 .25rem; text-align: center; font-weight: 600; font-size: 1rem; line-height: 1.42; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.choice-body { display: flex; flex-direction: column; gap: .5rem; padding: .9rem 1rem .95rem .2rem; min-width: 0; }
.choice-aim { font-weight: 600; font-size: 1.0625rem; line-height: 1.42; letter-spacing: -.005em; }
.choice-mem { font-size: .88rem; line-height: 1.4; color: var(--ink-dim); }
.choice-turn { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .55rem 1rem .6rem .95rem; border-top: 1px solid var(--line); color: var(--ink-dim); font-size: .86rem; font-weight: 500; line-height: 1.3; }
.turn-to { display: inline-flex; align-items: center; gap: .45rem; min-width: 0; }
.turn-to .ico { color: var(--sp); }
.turn-hex { display: inline-flex; align-items: center; gap: .35rem; flex: none; color: var(--ink-dim); }
@media (hover: hover) { .choice:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 16px 30px var(--shade); } }
.choice:active { transform: translateY(1px); }
.choice:focus-visible, .hero-card:focus-visible, .btn-go:focus-visible, .link:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.choice.picked { box-shadow: 0 0 0 2px var(--accent), 0 16px 34px var(--shade); }
.choice.dropped { opacity: .25; transform: translateY(8px) scale(.98); }
@media (min-width: 64rem) {
  .board { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; align-items: start; }
  .card-body { padding: 1.35rem 1.6rem 1.7rem; }
}
/* на широком экране карты поступков остаются на виду, пока читаешь сцену (если помещаются по высоте целиком) */
@media (min-width: 64rem) {
  .hand.pin { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6.6rem); }
}

/* люди жизни: жетоны */
.people { margin-top: 1.8rem; }
.people ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.people li { display: inline-flex; align-items: center; gap: .5rem; padding: .3rem .8rem .3rem .3rem; border-radius: 99px; background: var(--table-deep); border: 1px solid var(--table-line); font-size: .9rem; line-height: 1.3; }
.token { width: 1.9rem; height: 1.9rem; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--card); font-weight: 700; font-size: .85rem; }
.people .token { background: var(--card-2); color: var(--ink); width: 1.6rem; height: 1.6rem; font-size: .75rem; }
.table-foot { margin-top: 1.6rem; font-size: .88rem; color: var(--table-dim); }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--table-dim); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link.danger { color: var(--danger); }

/* путь по И-Цзин: внизу экрана, тихо */
.path { margin-top: 2rem; padding-top: .9rem; border-top: 1px solid var(--table-line); }
.path-label { margin: 0 0 .5rem; font-size: .82rem; font-weight: 600; color: var(--table-dim); }
.path-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; max-width: 30rem; }
.path-step, .path-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.path-step .hex { width: 100%; max-width: .9rem; height: auto; aspect-ratio: 20 / 23; color: var(--table-mid); }
.path-step .hex .hl { fill: var(--accent); }
.path-step::after { content: ""; width: 4px; height: 4px; border-radius: 50%; }
.path-step.now .hex { color: var(--table-ink); }
.path-step.now::after { background: var(--accent); }
.path-slot { justify-content: center; height: 1rem; }
.path-slot::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--table-line); }
.path-note { margin: .45rem 0 0; font-size: .8rem; line-height: 1.4; color: var(--table-dim); }
.result .path, .ending .path { margin-top: .6rem; }

/* итог поступка: карта переворачивается, ниже — следующая карта и закрывшиеся */
.result { display: grid; gap: 1.4rem; max-width: 46rem; margin: 0 auto; }
.result-band { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .8rem 1.15rem; border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.result-band .turn-to .ico { width: 1.2rem; height: 1.2rem; }
.result-band .turn-hex { gap: .3rem; font-size: .8rem; }
.result-title { margin: 0; font-size: 1.3rem; line-height: 1.32; font-weight: 650; letter-spacing: -.012em; text-wrap: balance; }
.outcome { padding: 1rem 1.1rem; border-radius: var(--r-small); background: var(--card-2); }
.outcome p { margin: 0; font-size: 1.1rem; line-height: 1.58; }
.tokens { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.tokens li { display: flex; align-items: center; gap: .6rem; font-size: .96rem; line-height: 1.35; }
.fork-row { display: grid; gap: .8rem; }
.mini { min-width: 0; border-radius: 14px; padding: .85rem .95rem; display: flex; flex-direction: column; gap: .3rem; }
.mini.open { padding: 0; gap: 0; overflow: hidden; background: var(--card); color: var(--ink); box-shadow: 0 0 0 2px var(--accent), var(--lift); }
.mini-art { aspect-ratio: 2 / 1; }
.mini-body { display: flex; flex-direction: column; gap: .3rem; padding: .75rem .95rem .9rem; min-width: 0; }
/* следующая карта: заголовок, а если впереди новый возраст — как изменится лицо */
.fork-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; margin-bottom: .7rem; }
.fork-head .table-title { margin: 0; }
.grow { display: flex; align-items: flex-start; gap: .45rem; }
.grow-face { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .2rem; }
.grow-face .face { width: 2.7rem; height: 2.7rem; margin: 0; border-radius: 50%; overflow: hidden; background: var(--table-deep); border: 2px solid var(--table-line); }
.grow-face:last-child .face { border-color: var(--accent); }
.grow-face figcaption { font-size: .72rem; line-height: 1.2; color: var(--table-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.grow-face:last-child figcaption { color: var(--accent); font-weight: 600; }
.grow-arrow { align-self: center; margin-top: -1rem; color: var(--table-mid); }
.mini.closed { flex-direction: row; align-items: baseline; gap: .7rem; padding: .55rem .8rem; color: var(--table-dim); border: 1px dashed var(--table-line); }
.mini-suit { display: inline-flex; align-items: center; gap: .3rem; font-size: .84rem; font-weight: 600; color: var(--ink-dim); }
.mini-suit .ico { color: var(--sp); }
.mini.closed .mini-suit, .mini.closed .mini-suit .ico { color: var(--table-dim); }
.mini.closed .mini-suit { flex: none; width: 5.6rem; }
.mini-title { font-weight: 650; font-size: 1.1rem; line-height: 1.25; letter-spacing: -.01em; }
.mini.closed .mini-title { font-size: .92rem; font-weight: 600; text-decoration-thickness: 1px; }
.mini-hook { margin: 0; font-size: .98rem; line-height: 1.48; }
.closed-stack { display: flex; flex-direction: column; gap: .45rem; min-width: 0; }
.closed-note { margin: .2rem 0 0; font-size: .8rem; color: var(--table-dim); }
.closed-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.go-bar { display: flex; justify-content: center; margin-top: 1.4rem; padding-bottom: env(safe-area-inset-bottom, 0px); }
.btn-go { width: 100%; max-width: 26rem; font: inherit; font-weight: 650; font-size: 1.06rem; letter-spacing: -.005em; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 14px; padding: .95rem 1.5rem; cursor: pointer;
  box-shadow: 0 3px 0 var(--accent-deep), 0 12px 24px var(--shade); transition: transform .1s ease, box-shadow .1s ease; }
.btn-go:hover { filter: brightness(1.04); }
.btn-go:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep), 0 6px 14px var(--shade); }
@media (min-width: 48rem) {
  .fork-row { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "open closed" "go closed"; align-items: start; }
  .fork-row.solo { grid-template-columns: minmax(0, 1fr); grid-template-areas: "open" "go"; }
  .fork-row > .open { grid-area: open; }
  .fork-row > .closed-stack { grid-area: closed; }
  .fork-row > .go-bar { grid-area: go; margin-top: .5rem; }
  .fork-row .btn-go { max-width: none; }
  .closed-note { margin-top: 0; }
}

/* старт */
.start { max-width: 62rem; margin: 0 auto; display: grid; gap: 1.1rem; padding-top: .8rem; }
.deck { position: relative; height: 7.2rem; margin-top: .4rem; }
.dc { position: absolute; left: 50%; top: .4rem; width: 4.2rem; height: 5.9rem; margin-left: -2.1rem; border-radius: 10px; background: var(--card); color: var(--sp); box-shadow: var(--lift);
  display: grid; place-items: start; padding: .45rem .5rem; transform-origin: 50% 135%; transform: rotate(var(--r)); animation: fan .9s cubic-bezier(.2, .8, .2, 1) backwards; }
.dc .ico { width: 1.35rem; height: 1.35rem; }
.dc:nth-child(1) { --r: -24deg; } .dc:nth-child(2) { --r: -8deg; } .dc:nth-child(3) { --r: 8deg; } .dc:nth-child(4) { --r: 24deg; }
.eyebrow { margin: 0; text-align: center; font-size: .92rem; font-weight: 600; letter-spacing: .01em; color: var(--accent); }
.title { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 1.7rem + 4.4vw, 4.6rem); line-height: .98; letter-spacing: -.045em; text-wrap: balance; overflow-wrap: anywhere; }
.lede { margin: 0 auto; max-width: 34rem; text-align: center; font-size: 1.1rem; line-height: 1.55; color: var(--table-dim); text-wrap: balance; }
.suit-legend { list-style: none; margin: .2rem auto 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .45rem; }
.suit-legend .suit { padding: .25rem .7rem .25rem .55rem; border-radius: 99px; border: 1px solid var(--table-line); color: var(--table-ink); }
.suit-legend .suit .ico { color: var(--sp-hi); }
.start .actions { display: flex; justify-content: center; margin-top: .3rem; }
.news { position: relative; width: 100%; max-width: 34rem; margin: 0 auto; padding: .8rem 2.6rem .9rem 1rem; border-radius: var(--r-small); background: var(--table-deep); border: 1px solid var(--table-line); color: var(--table-dim); font-size: .93rem; line-height: 1.5; }
.news-k { margin: 0 0 .2rem; color: var(--accent); font-weight: 650; font-size: .84rem; }
.news-t { margin: 0; text-wrap: pretty; }
.news-x { position: absolute; top: .35rem; right: .35rem; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--table-dim); font: inherit; font-size: 1.3rem; line-height: 1; cursor: pointer; }
.news-x:hover { color: var(--table-ink); background: var(--table-hi); }
.news-x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pick-title { margin: .9rem 0 0; text-align: center; font-weight: 650; font-size: 1.15rem; letter-spacing: -.01em; }
.hero-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; width: 100%; max-width: 44rem; margin: 0 auto; }
.hero-card { display: flex; flex-direction: column; text-align: left; padding: 0; font: inherit; color: var(--ink); background: var(--card); border: 0; border-radius: var(--r-card); overflow: hidden; cursor: pointer; box-shadow: var(--lift); transition: transform .18s ease, box-shadow .18s ease; }
@media (hover: hover) { .hero-card:hover { transform: translateY(-3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 18px 32px var(--shade); } }
.portrait { margin: 0; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; background: linear-gradient(160deg, var(--card-2), var(--table-dim)); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s ease; }
.portrait.ready img { opacity: 1; }
.portrait.gone img { display: none; }
/* на старте при наведении лицо взрослеет: слои старших возрастов поверх и подпись возраста */
.hero-card .portrait { position: relative; }
.portrait.ready img.age-layer { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
.portrait.ready img.age-layer.on { opacity: 1; }
.portrait.ready img.age-layer.cut { transition: none; }
.age-badge { position: absolute; left: .65rem; bottom: .65rem; padding: .22rem .6rem; border-radius: 99px; background: rgba(20, 28, 31, .72); color: var(--table-ink); font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.hero-card.aging .age-badge { opacity: 1; }
.portrait.gone { background: radial-gradient(ellipse 15% 12% at 50% 52%, var(--silhouette) 0 96%, transparent 100%), radial-gradient(ellipse 38% 26% at 50% 100%, var(--silhouette) 0 97%, transparent 100%), linear-gradient(160deg, var(--card-2), var(--table-dim)); }
.hero-name { padding: .8rem .9rem 0; font-family: var(--font-display); font-weight: 650; font-size: 1.2rem; line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
.hero-sub { padding: .25rem .9rem 0; font-size: .9rem; line-height: 1.38; color: var(--ink-dim); }
.meter { display: block; margin: .75rem .9rem .3rem; height: 4px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--accent-deep); }
.hero-progress { padding: 0 .9rem .85rem; font-size: .8rem; line-height: 1.3; color: var(--ink-dim); }
.hero-go { margin-top: auto; padding: .7rem .9rem; background: var(--accent); color: var(--accent-ink); font-weight: 650; font-size: 1rem; }
.warn { margin: 0 auto; max-width: 36rem; text-align: center; color: var(--danger); }
@media (min-width: 48rem) { .hero-row { gap: 1.4rem; } .hero-name { font-size: 1.3rem; } }

/* финал */
.ending { display: grid; gap: 1.5rem; max-width: 52rem; margin: 0 auto; }
.ages-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .55rem; }
.age-card { margin: 0; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--lift); }
.age-card .portrait { border-radius: 0; }
.age-num { display: block; padding: .35rem .2rem .45rem; text-align: center; font-weight: 600; font-size: .85rem; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legendary { position: relative; padding: 2px; border-radius: var(--r-card); background: linear-gradient(135deg, var(--accent-hi), var(--accent) 40%, var(--accent-deep) 70%, var(--accent-hi)); box-shadow: var(--lift); overflow: hidden; }
.legendary::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 35%, var(--accent-hi) 50%, transparent 65%); opacity: .45; transform: translateX(-110%); animation: shine 2s .6s ease-out both; }
.legendary-in { position: relative; border-radius: calc(var(--r-card) - 2px); background: var(--card); color: var(--ink); padding: 1.4rem 1.2rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.type-kicker { margin: 0 0 -.55rem; font-size: .98rem; font-weight: 500; color: var(--ink-dim); }
.type-name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 1.4rem + 2.8vw, 3.1rem); line-height: 1.04; letter-spacing: -.035em; text-wrap: balance; overflow-wrap: anywhere; }
.type-name.long { font-size: clamp(1.5rem, 7.4vw, 3.1rem); }
.type-essence { margin: 0; font-size: 1.2rem; line-height: 1.5; font-weight: 500; letter-spacing: -.008em; }
.type-why, .type-part, .type-more { padding-top: 1rem; border-top: 1px solid var(--line); }
.type-sum { display: grid; grid-template-columns: minmax(0, 1fr); gap: .45rem; }
.axis-card { display: flex; flex-direction: column; gap: .2rem; min-width: 0; padding: .85rem .95rem .9rem; border-radius: 12px; background: var(--card-2); }
.axis-q { font-size: .85rem; color: var(--ink-dim); }
.axis-v { font-size: 1.4rem; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; }
.axis-hint { font-size: 1rem; line-height: 1.4; }
.axis-pct { margin-top: .2rem; font-size: .85rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.type-plus { justify-self: center; font-size: 1.3rem; font-weight: 500; line-height: 1; color: var(--ink-dim); }
.type-rule { margin: .75rem 0 0; font-size: .92rem; line-height: 1.5; color: var(--ink-dim); }
.type-part p { margin: 0; font-size: 1.0625rem; line-height: 1.6; }
.type-essence, .type-rule, .type-part p, .deeds { max-width: 36em; }
.deeds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
.deeds li { display: grid; grid-template-columns: 4.3rem minmax(0, 1fr); gap: .8rem; font-size: 1.02rem; line-height: 1.45; }
.deed-age { color: var(--ink-dim); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.type-more summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.type-more summary::marker { color: var(--accent-deep); }
.type-note { margin: .9rem 0 0; font-size: .88rem; line-height: 1.5; color: var(--ink-dim); }
.type-grid { display: grid; gap: 1.3rem; margin-top: 1rem; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name num" "track track"; align-items: baseline; gap: .3rem .75rem; font-size: .92rem; color: var(--ink-dim); }
.bar-name { grid-area: name; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .45rem; min-width: 0; }
.bar-name b { font-weight: 600; color: var(--ink); }
.bar-hint { font-size: .86rem; }
.bar-num { grid-area: num; text-align: right; font-variant-numeric: tabular-nums; }
.bar-track { grid-area: track; height: .45rem; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 99px; background: var(--card-3); }
.bar.lead .bar-name b, .bar.lead .bar-num { color: var(--ink); font-weight: 700; }
.bar.lead .bar-fill { background: var(--accent-deep); }
.table-text { margin: 0; font-size: 1.06rem; line-height: 1.6; color: var(--table-ink); }
.cast { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); }
.person { display: flex; align-items: flex-start; gap: .7rem; padding: .8rem .9rem; border-radius: 14px; background: var(--card); color: var(--ink); box-shadow: var(--lift); font-size: .94rem; line-height: 1.4; }
.person .muted { color: var(--ink-dim); }
.map { padding: 1rem; border-radius: var(--r-card); background: var(--table-deep); border: 1px solid var(--table-line); }
.map-grid { display: flex; flex-direction: column; gap: 4px; margin-top: .4rem; }
.map-row { display: grid; grid-template-columns: 2rem repeat(4, minmax(0, 1fr)); gap: 4px; }
.map-age { align-self: center; font-size: .72rem; color: var(--table-dim); font-variant-numeric: tabular-nums; }
.map-h { display: flex; justify-content: center; align-items: center; gap: .25rem; padding-bottom: .2rem; color: var(--table-dim); font-size: .76rem; font-weight: 600; }
.map-h .ico { color: var(--sp-hi); }
.cell { min-height: 2rem; padding: .3rem; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: .68rem; line-height: 1.15; overflow: hidden; overflow-wrap: anywhere; }
.cell.none { background: transparent; }
.cell.unknown { color: var(--table-mid); border: 1px dashed var(--table-line); }
.cell.seen { background: var(--table-hi); color: var(--table-dim); }
.cell.mine { background: var(--card); color: var(--ink); font-weight: 600; }
.reveal { padding: 1rem 1.1rem; border-radius: var(--r-card); background: var(--table-deep); border: 1px solid var(--table-line); }
.reveal summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.reveal > p { margin: .8rem 0; font-size: .95rem; }
.reveal .hexno { font-size: .85em; color: var(--accent); }
.final-hex .hex { width: 2rem; height: 2.3rem; color: var(--table-ink); }
.final-hex .hex .hl { fill: var(--accent); }
.muted { color: var(--table-dim); }
.small { font-size: .88rem; }
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table { border-collapse: collapse; font-size: .85rem; line-height: 1.4; min-width: 32rem; }
th { text-align: left; color: var(--table-dim); font-weight: 600; border-bottom: 1px solid var(--table-line); padding: .35rem .5rem; font-size: .8rem; }
td { border-bottom: 1px solid var(--table-line); padding: .4rem .5rem; vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ending .actions { display: flex; justify-content: center; }
@media (max-width: 40rem) {
  .ages-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cell { font-size: .58rem; padding: .25rem .15rem; }
  .map-row { grid-template-columns: 1.6rem repeat(4, minmax(0, 1fr)); }
  .map-h span { display: none; }
}
@media (min-width: 40rem) { .type-sum { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; } }
@media (min-width: 48rem) { .legendary-in { padding: 2rem 2.1rem 2.1rem; } .type-grid { grid-template-columns: 1fr 1fr; gap: 2rem; } }

/* под картой типа: поделиться картинкой */
.share { display: flex; flex-direction: column; align-items: center; gap: .6rem; margin-top: -.4rem; }
.share-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; }
.btn-soft { font: inherit; font-weight: 600; font-size: .98rem; color: var(--table-ink); background: var(--table-deep); border: 1px solid var(--table-line); border-radius: 12px; padding: .65rem 1.15rem; cursor: pointer; transition: border-color .15s ease, color .15s ease; }
@media (hover: hover) { .btn-soft:hover { border-color: var(--accent); color: var(--accent-hi); } }
.btn-soft:active { transform: translateY(1px); }
.share-note { margin: 0; font-size: .88rem; color: var(--table-dim); text-align: center; }
.share-note:empty { display: none; }
.share-preview { margin: .3rem 0 0; display: flex; flex-direction: column; align-items: center; gap: .55rem; animation: deal .4s cubic-bezier(.2, .8, .2, 1) backwards; }
.share-preview img { display: block; width: min(19rem, 100%); height: auto; border-radius: 14px; box-shadow: var(--lift); }
.share-preview figcaption { max-width: 24rem; text-align: center; font-size: .85rem; line-height: 1.45; color: var(--table-dim); }

/* альбом жизни: шестнадцать сыгранных карт */
.album-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.album-card { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 12px; overflow: hidden; text-align: left; font: inherit; color: var(--ink); background: var(--card); box-shadow: var(--lift); cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease; }
@media (hover: hover) { .album-card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 16px 30px var(--shade); } }
.album-card .art-mark .ico { width: 2rem; height: 2rem; }
.album-body { display: flex; flex-direction: column; gap: .15rem; padding: .5rem .65rem .7rem; min-width: 0; }
.album-age { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.album-age .ico { width: 1em; height: 1em; color: var(--sp); }
.album-title { font-size: .92rem; font-weight: 600; line-height: 1.28; letter-spacing: -.005em; overflow-wrap: anywhere; }
@media (min-width: 40rem) { .album-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; } }

/* воспоминание: карта альбома целиком поверх стола */
html:has(dialog.memory[open]) { overflow: hidden; }
dialog.memory { width: min(44rem, calc(100% - 24px)); max-width: none; max-height: calc(100dvh - 24px); margin: auto; padding: 0; border: 0; border-radius: var(--r-card); background: transparent; color: var(--ink); overflow: auto; overscroll-behavior: contain; }
dialog.memory::backdrop { background: rgba(8, 13, 15, .8); }
.memory[open] .memory-card { animation: deal .32s cubic-bezier(.2, .8, .2, 1) backwards; }
.memory-card { position: relative; }
.memory-x { position: absolute; top: .6rem; right: .6rem; z-index: 2; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; padding: 0 0 .15rem; border: 0; border-radius: 50%; background: rgba(20, 28, 31, .66); color: var(--table-ink); font: inherit; font-size: 1.6rem; line-height: 1; cursor: pointer; }
.deed p { margin: 0; font-size: 1.08rem; font-weight: 600; line-height: 1.45; }
.memory-nav { display: flex; gap: .6rem; padding: 0 1.15rem 1.25rem; }
.nav-btn { flex: 1; font: inherit; font-weight: 600; font-size: .96rem; color: var(--ink); background: var(--card-2); border: 0; border-radius: 12px; padding: .75rem 1rem; cursor: pointer; }
.nav-btn[disabled] { opacity: .4; cursor: default; }
@media (hover: hover) { .nav-btn:not([disabled]):hover { background: var(--card-3); } }
.memory-x:focus-visible, .nav-btn:focus-visible, .btn-soft:focus-visible, .album-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (min-width: 64rem) { .memory-nav { padding: 0 1.6rem 1.6rem; } }

/* отладка */
.debug { margin-top: 2.5rem; padding: 1rem; border-radius: var(--r-small); background: var(--card); color: var(--ink); font-size: .85rem; }
.debug h3 { margin: 0 0 .5rem; font-size: 1rem; }
.debug pre { font-family: var(--font-mono); font-size: .75rem; white-space: pre-wrap; word-break: break-word; margin: .5rem 0 0; }
.debug textarea { width: 100%; font-family: var(--font-mono); font-size: .75rem; color: var(--ink); background: var(--card-2); border: 1px solid var(--ink-dim); }

/* движение: раздача карт, переворот итога; всё спокойное и короткое */
@keyframes deal { from { opacity: 0; transform: translateY(14px); } }
@keyframes flip { from { opacity: 0; transform: perspective(1100px) rotateY(-30deg); } }
@keyframes fan { from { transform: rotate(0deg) translateY(12px); } }
@keyframes shine { to { transform: translateX(110%); } }
@keyframes ring { from { --p: var(--p0); } }
@keyframes bump { 45% { transform: scale(1.16); border-color: var(--accent); color: var(--accent); } }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.07); } }
@keyframes line-turn { from { transform: scaleX(.15); opacity: 0; } 60% { opacity: 1; } }
.deal { animation: deal .4s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
.flip { animation: flip .5s cubic-bezier(.2, .8, .2, 1) backwards; }
/* картинка сцены очень медленно приближается, как будто смотришь внимательнее */
.scene-card .art.ready img, .finale .art.ready img, .memory-card .art.ready img { transform-origin: 50% 42%; animation: drift 30s cubic-bezier(.3, .2, .4, 1) both; }
/* вся жизнь перед глазами: кадры сыгранных сцен проходят поверх последнего вечера */
.finale .art.reel img.reel-frame { position: absolute; inset: 0; opacity: 0; transform: scale(1); animation: none; transition: opacity .55s ease, transform 2.6s cubic-bezier(.25, .6, .3, 1); }
.finale .art.reel img.reel-frame.on { opacity: 1; transform: scale(1.06); }
.reel-cap, .reel-btn { position: absolute; bottom: .8rem; border-radius: 99px; background: rgba(20, 28, 31, .66); color: var(--table-ink); font-size: .84rem; font-weight: 600; line-height: 1.25; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.reel-cap { left: .7rem; max-width: calc(100% - 1.4rem); padding: .3rem .7rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.reel.playing .reel-cap { opacity: 1; }
.reel-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.reel.playing .reel-bar { opacity: .9; animation: reel-bar var(--reel, 13s) linear both; }
@keyframes reel-bar { to { transform: scaleX(1); } }
.reel-btn { right: .7rem; display: inline-flex; align-items: center; gap: .3rem; padding: .38rem .85rem .38rem .6rem; border: 0; font-family: inherit; cursor: pointer; transition: opacity .35s ease .35s, background-color .2s ease; }
.reel-btn:hover { background: rgba(20, 28, 31, .84); }
.reel-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reel.playing .reel-btn, .reel.cued .reel-btn { opacity: 0; pointer-events: none; transition-delay: 0s; }
.reel.playing .reel-btn:focus-visible, .reel.cued .reel-btn:focus-visible { opacity: 1; pointer-events: auto; }
.reel:has(.reel-btn:focus-visible) .reel-cap { max-width: calc(100% - 12rem); }
.reel.playing { cursor: pointer; }
.ico-play { fill: currentColor; stroke: none; color: var(--accent); }
/* в итоге поступка перевёрнутая черта гексаграммы ложится на место */
.result-band .hex .hl { transform-box: fill-box; transform-origin: center; animation: line-turn .7s .55s cubic-bezier(.2, .8, .2, 1) backwards; }

/* смена экранов (View Transitions): экран мягко сменяется, сыгранная карта переворачивается и становится итогом,
   следующая карта вырастает в сцену, лицо в табло взрослеет постепенно */
::view-transition-old(root) { animation: vt-out .24s ease both; }
::view-transition-new(root) { animation: vt-rise .42s cubic-bezier(.2, .8, .2, 1) both; }

// переводит жизнь в другую сферу. Пол героя — две разные жизни, а не замена окончаний.






const TOTAL_EPISODES = 16;
const SCHEMA_VERSION = 3;
const ACT_WEIGHTS = [1, 1, 2, 1];
const CHILD_EPISODE = 7; // тридцать пять лет

const AGE_WORDS = {
  6: 'шесть', 10: 'десять', 14: 'четырнадцать', 17: 'семнадцать', 23: 'двадцать три', 28: 'двадцать восемь',
  35: 'тридцать пять', 39: 'тридцать девять', 46: 'сорок шесть', 51: 'пятьдесят один', 55: 'пятьдесят пять',
  59: 'пятьдесят девять', 65: 'шестьдесят пять', 71: 'семьдесят один', 78: 'семьдесят восемь', 84: 'восемьдесят четыре',
};
function yearsWord(n) {
  const d = n % 10, dd = n % 100;
  if (d === 1 && dd !== 11) return 'год';
  if (d >= 2 && d <= 4 && (dd < 12 || dd > 14)) return 'года';
  return 'лет';
}
const ageText = (age) => `${AGE_WORDS[age] ?? age} ${yearsWord(age)}`;
const ageOf = (episode) => AGES[episode - 1];

const actOf = (episode) => Math.floor((episode - 1) / 4); // 0..3

/** Четыре старта: №57 (дом) и соседние узлы, отличающиеся одной из черт 1, 2, 3, — дорога, дело, близкие.
 *  Поэтому уже в шесть лет жизнь начинается в любой из четырёх сторон, и сцен в каждой жизни 16 × 4 = 64. */
const START_OPTIONS = [0, 1, 2, 4].map((mask) => START_BITS ^ mask);
const randomStart = (rand = Math.random) => Math.floor(rand() * START_OPTIONS.length);

function newGame(sex = 'M', start = 0) {
  const b = START_OPTIONS[start] ?? START_BITS;
  return { v: SCHEMA_VERSION, sex: sex === 'F' ? 'F' : 'M', initialBits: b, bits: b, episode: 1, facts: {}, journal: [], acked: 0 };
}

const isOver = (state) => state.episode > TOTAL_EPISODES;

// ---------- память ----------

const val = (facts, key) => (facts[key] ? facts[key].v : null);

/** Производные факты.
 *  Ребёнок: если к тридцати пяти годам герой в браке, ребёнок есть и дальше остаётся, даже после развода
 *  (в этот момент он записывается в память). Поздний брак ребёнка не создаёт.
 *  «@ключ»: человек уже появлялся в жизни героя, и о нём можно говорить без представления. */
function view(state) {
  const f = {};
  for (const [k, x] of Object.entries(state.facts)) f[k] = x.v;
  if (state.episode === CHILD_EPISODE && f.son === undefined && f.daughter === undefined) {
    if (state.sex === 'M' && f.wife) f.son = true;
    if (state.sex === 'F' && f.husband) f.daughter = true;
  }
  for (const p of PEOPLE[state.sex]) if (f[p.key] !== undefined && f[p.key] !== null) f[`@${p.key}`] = true;
  return f;
}
const isSource = (k) => k[0] !== '@';

/** Условие абзаца или варианта: 'факт', '!факт', 'факт=a|b', несколько через '&'. */
function holds(cond, f) {
  if (!cond) return true;
  return cond.split('&').every((term) => {
    const t = term.trim();
    if (t.startsWith('!')) {
      const [k, vals] = t.slice(1).split('=');
      if (vals === undefined) return !f[k];
      return !vals.split('|').includes(String(f[k]));
    }
    const [k, vals] = t.split('=');
    if (vals === undefined) return !!f[k];
    return vals.split('|').includes(String(f[k]));
  });
}
const keysOf = (cond) => (cond ? cond.split('&').map((t) => t.trim().replace(/^!/, '').split('=')[0]) : []);

function heirForms(sex, f) {
  const h = HEIR[sex === 'F' ? 'F' : 'M'];
  return h.pick(f);
}

function fill(text, sex, f) {
  const forms = heirForms(sex, f);
  return text.replace(/\{(heir\w*)\}/g, (m, k) => forms[k] ?? m);
}

// ---------- люди и память ----------

const ageAt = (episode) => `${AGE_WORDS[ageOf(episode)]} ${yearsWord(ageOf(episode))}`;
/** «В десять лет ты …» — как прошлый поступок вспоминается в сцене. */
const recall = (state, episode) => {
  const j = state.journal[episode - 1];
  return j ? `В ${ageAt(episode)} ты ${j.echo}.` : null;
};

/** Состояние человека по факту памяти. */
function personStatus(p, value) {
  if (value === null || value === undefined || value === false) return null;
  return p.st[String(value)] ?? null;
}

const CHILD_STATUS = { M: ['растёт', 'вырос', 'сам уже отец'], F: ['растёт', 'выросла', 'сама уже мама'] };

/** Люди жизни, которых герой уже встретил, в порядке появления. */
function peopleOf(state) {
  const f = view(state);
  const out = [];
  for (const p of PEOPLE[state.sex]) {
    let status = personStatus(p, f[p.key]);
    if (!status) continue;
    const child = p.key === 'son' || p.key === 'daughter';
    if (child) {
      const [young, grown, parent] = CHILD_STATUS[state.sex];
      status = f.successor === 'heir' ? 'продолжает твоё дело' : state.episode > 13 ? parent : state.episode > 9 ? grown : young;
    }
    const name = child ? heirForms(state.sex, f).heir : p.name;
    const src = state.facts[p.key] ? state.facts[p.key].src : (state.facts.wife || state.facts.husband || { src: 7 }).src;
    out.push({ key: p.key, name, who: p.who, status, since: src });
  }
  return out.sort((a, b) => a.since - b.since);
}

/** Кто из людей изменился после поступка: «Лёша это запомнит». */
function remembered(sex, before, after) {
  const out = [];
  for (const p of PEOPLE[sex]) {
    if (p.key === 'son' || p.key === 'daughter') continue;
    const a = after[p.key] ? after[p.key].v : undefined;
    const b = before[p.key] ? before[p.key].v : undefined;
    if (a === undefined || a === b) continue;
    const status = personStatus(p, a);
    if (status) out.push({ key: p.key, name: p.name, status });
  }
  return out;
}

/** Последний поступок, после которого изменились отношения с человеком. */
function lastWith(state, key) {
  const x = state.facts[key];
  return x ? x.src : null;
}

// ---------- сцена ----------

function choiceId(episode, line) {
  return `e${episode}-l${line}`;
}

function situation(sex, episode, bits) {
  const ep = LIFE[sex === 'F' ? 'F' : 'M'][episode - 1];
  const sp = sphere(bits);
  const sit = ep.s[sp];
  if (!sit) throw new Error(`no situation for ${sex} e${episode} sphere ${sp}`);
  return { ep, sp, sit };
}

function resolveAction(a, f, sex, sources, facts) {
  const out = { line: a.l, text: a.t, cost: a.c, note: a.n, echo: a.e, set: a.s || {} };
  for (const v of a.alt || []) {
    if (holds(v.if, f)) {
      for (const [k, kk] of [['t', 'text'], ['c', 'cost'], ['n', 'note'], ['e', 'echo'], ['s', 'set']]) if (v[k] !== undefined) out[kk] = v[k];
      keysOf(v.if).forEach((k) => isSource(k) && facts[k] && sources.add(facts[k].src));
      break;
    }
  }
  for (const k of ['text', 'cost', 'note', 'echo']) out[k] = fill(out[k], sex, f);
  return out;
}

/** Ранние сцены той же гексаграммы в этой жизни. */
function sceneHexes(state) {
  const list = [{ episode: 1, hex: hexNumber(state.initialBits), bits: state.initialBits }];
  state.journal.forEach((j, i) => { if (i + 2 <= TOTAL_EPISODES) list.push({ episode: i + 2, hex: hexNumber(j.to), bits: j.to }); });
  return list;
}

/** Экран эпизода. opts.patternEffect=false — абляция (только для тестов и отладки): сфера всегда «дом» при наличии. */
function buildScene(state, opts = {}) {
  if (isOver(state)) throw new Error('life is over');
  const patternEffect = opts.patternEffect !== false;
  const f = view(state);
  let { ep, sp, sit } = situation(state.sex, state.episode, state.bits);
  if (!patternEffect) {
    const first = Object.keys(ep.s).map(Number).sort()[0];
    sp = first; sit = ep.s[first];
  }
  const hex = hexNumber(state.bits);
  const sources = new Set();
  const paragraphs = [];

  if (sp === 0 && f.base === 'away') paragraphs.push(state.sex === 'F' ? 'Ты снова живёшь дома, в городе своего детства.' : 'Ты снова живёшь в Заречье.');
  for (const piece of sit.p) {
    const [cond, text] = Array.isArray(piece) ? piece : [null, piece];
    if (!holds(cond, f)) continue;
    keysOf(cond).forEach((k) => isSource(k) && state.facts[k] && sources.add(state.facts[k].src));
    paragraphs.push(fill(text, state.sex, f));
  }

  let revisit = null;
  if (patternEffect) {
    // Узнавание показываем редко: один раз за жизнь и только когда узел возвращается спустя годы.
    const earlier = sceneHexes(state).filter((s) => s.hex === hex && s.episode <= ep.n - 4);
    const shownBefore = state.journal.some((j) => j.revisit);
    if (earlier.length && !shownBefore) {
      const first = earlier[0];
      revisit = { episode: first.episode, hex };
      paragraphs.push(`Странное чувство: всё это уже было, когда тебе было ${ageText(ageOf(first.episode))}. Тот же выбор, только ставки другие.`);
    }
  }

  const all = sit.a.map((a) => {
    const before = new Set(sources);
    const r = resolveAction(a, f, state.sex, sources, state.facts);
    const to = flip(state.bits, a.l);
    const echoOf = [...sources].filter((e) => !before.has(e));
    const next = ep.n < TOTAL_EPISODES ? situation(state.sex, ep.n + 1, to) : null;
    return { id: choiceId(ep.n, a.l), ...r, role: LINE_ROLE[a.l], to, toHex: hexNumber(to), toSphere: sphere(to),
      toTitle: next ? next.sit.title : null, memory: echoOf };
  });
  const shown = [...all].sort((a, b) => ((a.line * 5 + ep.n * 3 + sp) % 7) - ((b.line * 5 + ep.n * 3 + sp) % 7) || a.line - b.line);
  const lines = shown.map((c) => c.line);

  // Память сцены: поступки, от которых зависит текст, и последние встречи с людьми, о которых идёт речь.
  const said = [...paragraphs, ...all.map((c) => c.text)].join(' ');
  const memEps = new Set([...sources].filter((e) => e < ep.n));
  for (const p of PEOPLE[state.sex]) {
    if (!p.re || !p.re.test(said)) continue;
    const e = lastWith(state, p.key);
    if (e && e < ep.n) memEps.add(e);
  }
  const memory = [...memEps].sort((a, b) => b - a).slice(0, 3).sort((a, b) => a - b)
    .map((e) => ({ episode: e, age: ageOf(e), text: recall(state, e) })).filter((m) => m.text);

  return {
    episode: ep.n, age: ep.age, ageText: ageText(ep.age), title: sit.title, act: actOf(ep.n),
    sphere: sp, sphereRu: SPHERES[sp], img: `${state.sex}${ep.n}-${sp}`,
    hex, pattern: PATTERN_BY_N[hex], paragraphs, revisit, memory, people: peopleOf(state),
    hidden: [1, 2, 3, 4, 5, 6].filter((l) => !lines.includes(l)),
    choices: shown.map(({ id, line, text, cost, toHex, toSphere, toTitle, memory: m }) => ({
      id, line, text, cost, toHex, toSphere, toSphereRu: SPHERES[toSphere], toTitle,
      memory: m.filter((e) => e < ep.n).map((e) => recall(state, e)).filter(Boolean) })),
    allChoices: all,
    sources: [...sources].sort((a, b) => a - b),
  };
}

function applyChoice(state, id, opts = {}) {
  if (isOver(state)) throw new Error('life is over');
  if (state.acked !== state.journal.length) throw new Error('previous result not acknowledged');
  const scene = buildScene(state, opts);
  const full = scene.allChoices.find((c) => c.id === id);
  if (!full) throw new Error(`choice ${id} is not offered in episode ${state.episode}`);
  const to = flip(state.bits, full.line);
  if (popcount(state.bits ^ to) !== 1) throw new Error('invariant: exactly one line');

  const facts = { ...state.facts };
  if (scene.sphere === 0 && facts.base && facts.base.v === 'away') facts.base = { v: 'home', src: state.episode };
  // Ребёнок, который есть в тридцать пять, остаётся в жизни героя навсегда.
  const fv = view(state);
  if (fv.son && !facts.son) facts.son = { v: true, src: (facts.wife || { src: state.episode }).src };
  if (fv.daughter && !facts.daughter) facts.daughter = { v: true, src: (facts.husband || { src: state.episode }).src };
  for (const [k, v] of Object.entries(full.set)) facts[k] = { v, src: state.episode };
  // Кого герой уже видел в тексте сцены, в вариантах поступков или в итоге.
  const seen = [...scene.paragraphs, ...scene.choices.map((c) => `${c.text} ${c.cost}`), full.note].join(' ');
  for (const p of PEOPLE[state.sex]) {
    if (!p.re || p.key === 'father' || p.key === 'mother' || facts[`@${p.key}`]) continue;
    if (p.re.test(seen)) facts[`@${p.key}`] = { v: true, src: state.episode };
  }
  // Преемник фиксируется в момент передачи, чтобы имя не менялось задним числом.
  if (full.set.successor === 'heir') {
    const h = heirForms(state.sex, view({ ...state, facts }));
    facts.heirName = { v: h.heir, src: state.episode };
  }

  const remembers = remembered(state.sex, state.facts, facts);
  const entry = {
    episode: state.episode, choiceId: id, line: full.line, role: full.role, from: state.bits, to, remembers,
    fromHex: scene.hex, toHex: hexNumber(to), sphere: scene.sphere, toSphere: sphere(to), title: scene.title, img: scene.img,
    text: full.text, cost: full.cost, note: full.note, echo: full.echo,
    sources: scene.sources, revisit: scene.revisit,
  };
  return { ...state, bits: to, episode: state.episode + 1, facts, journal: [...state.journal, entry] };
}

const acknowledge = (state) => ({ ...state, acked: state.journal.length });
const pendingResult = (state) => (state.acked < state.journal.length ? state.journal[state.journal.length - 1] : null);

/** Крючок следующей сцены: строка или список [условие, строка], первый подходящий. */
function hookOf(hook, sex, f) {
  if (!hook) return null;
  for (const piece of Array.isArray(hook) ? hook : [hook]) {
    const [cond, text] = Array.isArray(piece) ? piece : [null, piece];
    if (holds(cond, f)) return fill(text, sex, f);
  }
  return null;
}

/** Развилка после поступка: куда повернула жизнь и какие сцены закрылись. */
function forkOf(state, j = pendingResult(state)) {
  if (!j || j.episode >= TOTAL_EPISODES) return null;
  const { sit: from } = situation(state.sex, j.episode, j.from);
  const next = situation(state.sex, j.episode + 1, j.to);
  const closed = [];
  for (const a of from.a) {
    const t = situation(state.sex, j.episode + 1, flip(j.from, a.l));
    if (t.sp !== next.sp && !closed.find((c) => c.sphere === t.sp)) closed.push({ sphere: t.sp, sphereRu: SPHERES[t.sp], title: t.sit.title });
  }
  const f = view(state);
  return {
    age: ageOf(j.episode + 1), ageText: ageText(ageOf(j.episode + 1)), years: ageOf(j.episode + 1) - ageOf(j.episode),
    sphere: next.sp, sphereRu: SPHERES[next.sp], title: next.sit.title, hook: hookOf(next.sit.hook, state.sex, f),
    closed: closed.sort((a, b) => a.sphere - b.sphere),
  };
}

/** Все сцены жизни: ключ → название (для карты жизни). */
function sceneMap(sex) {
  const out = [];
  LIFE[sex === 'F' ? 'F' : 'M'].forEach((ep) => {
    out.push({ episode: ep.n, age: ep.age, scenes: [0, 1, 2, 3].map((sp) => (ep.s[sp] ? { sphere: sp, key: `${sex}${ep.n}-${sp}`, title: ep.s[sp].title } : null)) });
  });
  return out;
}

// ---------- тип ----------

/** Доли квадр одного решения по координатам узла, в который оно привело. */
function quadShares(bits) {
  const { x, y } = coords(bits);
  const a = (x + 0.5) / 8, v = (y + 0.5) / 8;
  return { air: a * v, fire: a * (1 - v), water: (1 - a) * v, earth: (1 - a) * (1 - v) };
}

/** Доли в процентах с точностью до сотых, сумма ровно 100,00 (метод наибольших остатков). */
function largestRemainder(values, keys) {
  const total = keys.reduce((s, k) => s + values[k], 0) || 1;
  const raw = keys.map((k) => ({ k, x: (values[k] / total) * 10000 }));
  const out = Object.fromEntries(raw.map((r) => [r.k, Math.floor(r.x)]));
  let left = 10000 - raw.reduce((s, r) => s + Math.floor(r.x), 0);
  raw.sort((p, q) => (q.x - Math.floor(q.x)) - (p.x - Math.floor(p.x)) || keys.indexOf(p.k) - keys.indexOf(q.k));
  for (let i = 0; left > 0; i++, left--) out[raw[i % raw.length].k]++;
  return Object.fromEntries(keys.map((k) => [k, out[k] / 100]));
}

/** Ведущий ключ; ничья: вклад III акта, затем самое позднее различающее решение, затем порядок ключей. */
function leader(keys, total, act3, perDecision) {
  const eps = 1e-9;
  const top = Math.max(...keys.map((k) => total[k]));
  let cand = keys.filter((k) => top - total[k] < eps);
  if (cand.length > 1) {
    const m = Math.max(...cand.map((k) => act3[k]));
    cand = cand.filter((k) => m - act3[k] < eps);
  }
  for (let i = perDecision.length - 1; i >= 0 && cand.length > 1; i--) {
    const d = perDecision[i];
    const m = Math.max(...cand.map((k) => d[k] || 0));
    cand = cand.filter((k) => m - (d[k] || 0) < eps);
  }
  return cand[0];
}

function typeProfile(state) {
  const quad = Object.fromEntries(QUAD_ORDER.map((k) => [k, 0]));
  const role = Object.fromEntries(ROLE_ORDER.map((k) => [k, 0]));
  const quad3 = { ...quad }, role3 = { ...role };
  const perQuad = [], perRole = [];
  state.journal.forEach((j) => {
    const act = actOf(j.episode);
    const w = ACT_WEIGHTS[act];
    const q = quadShares(j.to);
    for (const k of QUAD_ORDER) { quad[k] += w * q[k]; if (act === 2) quad3[k] += w * q[k]; }
    const r = LINE_ROLE[j.line];
    role[r] += w; if (act === 2) role3[r] += w;
    perQuad.push(q); perRole.push({ [r]: 1 });
  });
  const q = leader(QUAD_ORDER, quad, quad3, perQuad);
  const r = leader(ROLE_ORDER, role, role3, perRole);
  return {
    quad: q, role: r, name: TYPES[q][r].name,
    quadShares: largestRemainder(quad, QUAD_ORDER), roleShares: largestRemainder(role, ROLE_ORDER),
  };
}

const words = (s) => s.split(/\s+/).filter(Boolean).length;

const gen = (sex, m, f) => (sex === 'F' ? f : m);

/** Портрет: основа типа + 3–4 решения, которые его подтверждают. */
function portrait(state, profile) {
  const base = TYPES[profile.quad][profile.role].base.replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, fe) => gen(state.sex, m, fe));
  const scored = state.journal.map((j, i) => ({
    i, j, s: (LINE_ROLE[j.line] === profile.role ? 2 : 0) + quadShares(j.to)[profile.quad] + ACT_WEIGHTS[actOf(j.episode)] * 0.1,
  })).filter((x) => x.j.episode < TOTAL_EPISODES).sort((a, b) => b.s - a.s || b.i - a.i);
  const picked = scored.slice(0, 4).sort((a, b) => a.i - b.i);
  const pieces = [];
  const evidence = [];
  const deeds = [];
  for (const { j } of picked) {
    const age = ageOf(j.episode);
    const e = `в ${AGE_WORDS[age]} ${yearsWord(age)} ты ${j.echo}`;
    const s = pieces.length ? `${e.charAt(0).toUpperCase()}${e.slice(1)}.` : `Это видно по твоим поступкам: ${e}.`;
    if (evidence.length >= 3 && words([base, ...pieces, s].join(' ')) > 130) break;
    pieces.push(s); evidence.push(j.episode);
    deeds.push({ episode: j.episode, age, text: `${j.echo.charAt(0).toUpperCase()}${j.echo.slice(1)}` });
  }
  // Основа типа — четыре предложения: суть, два о человеке, цена («Цена была в том, что …»).
  const sentences = base.match(/[^.!?]+[.!?]+(?:\s|$)/g).map((x) => x.trim());
  const priceAt = sentences.findIndex((x) => x.startsWith('Цена была в том, что'));
  const priceRaw = priceAt >= 0 ? sentences[priceAt].replace(/^Цена была в том, что,?\s+/, '') : '';
  return {
    text: [base, ...pieces].join(' '), evidence, deeds,
    essence: sentences[0],
    about: sentences.slice(1, priceAt >= 0 ? priceAt : undefined).join(' '),
    price: priceRaw && `${priceRaw.charAt(0).toUpperCase()}${priceRaw.slice(1)}`,
  };
}

// ---------- эпилог ----------

function buildEpilogue(state) {
  if (!isOver(state)) throw new Error('life is not over');
  const f = view(state);
  const finalHex = hexNumber(state.bits);
  const fp = PATTERN_BY_N[finalHex];
  const last = state.journal[state.journal.length - 1];

  const legacy = [];
  for (const rule of LEGACY[state.sex]) {
    if (holds(rule.if, f)) legacy.push(fill(rule.t, state.sex, f));
    if (legacy.length >= 4) break;
  }

  const refCount = {};
  for (const j of state.journal) for (const s of j.sources) refCount[s] = (refCount[s] || 0) + 1;
  const all = Object.entries(refCount)
    .map(([e, c]) => ({ e: Number(e), c }))
    .filter((r) => r.e < TOTAL_EPISODES)
    .sort((a, b) => b.c - a.c || a.e - b.e);
  const picked = [];
  for (const [lo, hi] of [[1, 4], [5, 8], [9, 15]]) {
    const best = all.find((r) => r.e >= lo && r.e <= hi);
    if (best) picked.push(best);
  }
  for (const r of all) if (picked.length < 3 && !picked.includes(r)) picked.push(r);
  for (const e of [1, 6, 10, 13]) if (picked.length < 3 && !picked.find((p) => p.e === e)) picked.push({ e, c: 0 });
  const references = picked.sort((a, b) => a.e - b.e).map(({ e, c }) => {
    const j = state.journal[e - 1];
    const age = ageOf(e);
    return { episode: e, age, count: c, text: `В ${AGE_WORDS[age]} ${yearsWord(age)} ты ${j.echo}.` };
  });

  const hexes = sceneHexes(state);
  const seen = {};
  hexes.forEach((s) => { (seen[s.hex] = seen[s.hex] || []).push(ageOf(s.episode)); });
  const repeated = Object.entries(seen).filter(([, ages]) => ages.length > 1)
    .map(([hex, ages]) => ({ hex: Number(hex), motif: PATTERN_BY_N[hex].motif, ages }));

  const route = state.journal.map((j) => {
    const p = PATTERN_BY_N[j.fromHex];
    return { episode: j.episode, age: ageOf(j.episode), hex: j.fromHex, motif: p.motif, variation: p.variation, quadrum: p.quadrum, line: j.line, role: LINE_ROLE[j.line], sphere: SPHERES[j.sphere], title: j.title, choice: j.text };
  });

  const lineFlips = [0, 0, 0, 0, 0, 0];
  state.journal.forEach((j) => lineFlips[j.line - 1]++);

  const profile = typeProfile(state);
  const p = portrait(state, profile);
  const g = (t) => t.replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, fe) => gen(state.sex, m, fe));

  return {
    opening: `${OPENING[state.sex]} В последний свой вечер ты ${last.echo}.`,
    legacy,
    references,
    type: {
      ...profile,
      quadRu: QUAD_RU[profile.quad], roleRu: ROLE_RU[profile.role],
      hint: g(`Больше всего в этой жизни было стихии «${QUAD_RU[profile.quad]}»: ${QUAD_HINT[profile.quad]}. А поступал{|а} ты чаще всего как ${ROLE_RU[profile.role]}: ${ROLE_HINT[profile.role]}.`),
      quadHint: QUAD_HINT[profile.quad], roleHint: g(ROLE_HINT[profile.role]),
      portrait: p.text, evidence: p.evidence,
      essence: p.essence, about: p.about, price: p.price, deeds: p.deeds,
    },
    final: {
      hex: finalHex, motif: fp.motif, bits: bitString(state.bits), ...coords(state.bits),
      text: `Если коротко назвать то, чем закончилась твоя жизнь, вышло бы «${fp.motif.toLowerCase()}». После тебя остался вопрос: ${fp.hook}.`,
    },
    repeated, route, lineFlips,
    distinctNodes: Object.keys(seen).length,
    people: peopleOf(state),
    path: state.journal.map((j) => `${state.sex}${j.episode}-${j.sphere}`),
  };
}

// ---- src/core/save.js ----
// Сохранение: журнал решений + снимок + контрольная сумма. При загрузке история воспроизводится заново.

const SAVE_KEY = 'prozhit-zhizn:v3';

function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

const journalOf = (state) => state.journal.map((j) => ({ episode: j.episode, choiceId: j.choiceId, line: j.line, from: j.from, to: j.to }));

function serialize(state) {
  const body = {
    schemaVersion: SCHEMA_VERSION, sex: state.sex, initialBits: state.initialBits,
    journal: journalOf(state), acked: state.acked,
    snapshot: { bits: state.bits, episode: state.episode },
  };
  return JSON.stringify({ ...body, checksum: fnv1a(JSON.stringify(body)) });
}

/** Возвращает восстановленное состояние или null, если сохранение повреждено. Ложную биографию не показываем. */
function deserialize(text) {
  try {
    const data = JSON.parse(text);
    const { checksum, ...body } = data;
    if (data.schemaVersion !== SCHEMA_VERSION) return null;
    if (fnv1a(JSON.stringify(body)) !== checksum) return null;
    if (body.sex !== 'M' && body.sex !== 'F') return null;
    const start = START_OPTIONS.indexOf(body.initialBits);
    if (start < 0) return null;
    let s = newGame(body.sex, start);
    for (const j of body.journal) {
      if (j.episode !== s.episode || j.from !== s.bits) return null;
      s = acknowledge(applyChoice(s, j.choiceId));
      if (s.bits !== j.to) return null;
    }
    if (s.bits !== body.snapshot.bits || s.episode !== body.snapshot.episode) return null;
    const acked = body.acked;
    if (!(acked === s.journal.length || acked === s.journal.length - 1)) return null;
    return { ...s, acked };
  } catch {
    return null;
  }
}

/** Обёртка над localStorage; любые ошибки хранилища не ломают игру. */
const storage = {
  load(ls) {
    try { const t = ls.getItem(SAVE_KEY); return t ? deserialize(t) : null; } catch { return null; }
  },
  save(ls, state) {
    try { ls.setItem(SAVE_KEY, serialize(state)); return true; } catch { return false; }
  },
  clear(ls) {
    try { ls.removeItem(SAVE_KEY); } catch { /* ignore */ }
  },
  exists(ls) {
    try { return !!ls.getItem(SAVE_KEY); } catch { return false; }
  },
};

// Интерфейс «Колода жизни»: старт (его или её жизнь), сцена-карта и четыре карты поступков,
// итог поступка с развилкой, финал с картой-типом. Внизу экранов — путь по И-Цзин. Скрытая отладка: ?debug=1.







const root = document.getElementById('app');
const hud = document.getElementById('hud');
const DEBUG = /[?&]debug=1/.test(location.search) || location.hash === '#debug';
const LS = (() => { try { return window.localStorage; } catch { return null; } })();
const calm = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };

let state = null;
let busy = false;
let confirmRestart = false;
let debugOpts = { patternEffect: true };

// Русская типографика: короткие слова и числа не остаются в конце строки, тире и частицы не начинают новую.
const SHORT_WORD = /^[«„"(]*(?:[а-яёА-ЯЁ]{1,2}|\d+)$/;
const GLUE_BEFORE = /^(?:[—–]|же|ли|бы)(?=$|[.,!?:;»)])/;
function typo(text) {
  const parts = String(text).split(' ');
  let out = parts[0];
  for (let i = 1; i < parts.length; i++) {
    // короткое последнее слово длинной фразы тоже не остаётся одно на строке
    const lastShort = i === parts.length - 1 && parts.length >= 5 && parts[i].length <= 7;
    out += (SHORT_WORD.test(parts[i - 1]) || GLUE_BEFORE.test(parts[i]) || lastShort ? '\u00A0' : ' ') + parts[i];
  }
  return out;
}

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  const raw = tag === 'pre' || tag === 'textarea';
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(raw ? kid : typo(kid)));
  return n;
};
const g = (t) => t.replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, f) => (state && state.sex === 'F' ? f : m));

// Четыре стороны жизни. Каждая карта поступка ведёт в свою: три поворачивают жизнь, одна оставляет её там, где она есть.
const SUITS = [
  { name: 'Дом', to: 'к дому', stay: 'дома' },
  { name: 'Дорога', to: 'в дорогу', stay: 'в дороге' },
  { name: 'Дело', to: 'к делу', stay: 'при деле' },
  { name: 'Близкие', to: 'к близким', stay: 'с близкими' },
];
const turnText = (from, to, done) => (from === to ? `Жизнь ${done ? 'осталась' : 'останется'} ${SUITS[to].stay}` : `Жизнь ${done ? 'повернула' : 'повернёт'} ${SUITS[to].to}`);
const ICON_PATHS = [
  ['M3.5 11.5 12 4l8.5 7.5', 'M6 10v10h12V10', 'M10 20v-5h4v5'],
  ['M12 3v18', 'M12 5h6.5l2 2.25-2 2.25H12', 'M12 12H5.5l-2 2.25 2 2.25H12'],
  ['M4 8h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z', 'M9 8V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V8', 'M3 13.5h18'],
  ['M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z'],
];
function icon(sp) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('class', 'ico');
  svg.setAttribute('aria-hidden', 'true');

const suitChip = (sp, text = SUITS[sp].name) => el('span', { class: `suit sp${sp}` }, icon(sp), text);

/** Гексаграмма И-Цзин: шесть черт снизу вверх, сплошная — Ян, прерванная — Инь; перевёрнутая черта выделена. */

  const NS = 'http://www.w3.org/2000/svg';

  svg.setAttribute('viewBox', '0 0 20 23');
  svg.setAttribute('class', 'hex');
  svg.setAttribute('role', 'img');

  const t = document.createElementNS(NS, 'title');

const ORDINAL = ['первая', 'вторая', 'третья', 'четвёртая', 'пятая', 'шестая'];

/** Путь по И-Цзин внизу экрана: начало и шестнадцать решений, каждое состояние — гексаграмма, перевёрнутая черта выделена. */
function pathStrip() {
  const steps = [{ bits: state.initialBits, line: null }, ...state.journal.map((j) => ({ bits: j.to, line: j.line }))];
  const now = steps.length - 1;
  const pend = pendingResult(state);
  const cur = hexNumber(steps[now].bits);
  const caption = pend ? `№${pend.fromHex} → №${pend.toHex}: перевернулась ${ORDINAL[pend.line - 1]} черта`

    el('p', { class: 'path-label' }, 'Путь по И-Цзин'),

      const n = hexNumber(s.bits);

/** Иллюстрация: сначала локальная копия img/, затем оригинал; если ничего не загрузилось, остаётся заглушка.
 *  eager — грузить сразу (следующая карта, воспоминание), а не когда до картинки дойдёт прокрутка. */
// Ширина картинки на экране для выбора из srcset: телефон, планшет, ноутбук (замерено по вёрстке).
const SIZES = {
  scene: '(min-width: 800px) 740px, calc(100vw - 32px)',
  mini: '(min-width: 800px) 434px, calc(100vw - 32px)',
  finale: '(min-width: 1100px) 832px, calc(100vw - 32px)',
  album: '200px',
  memory: '(min-width: 800px) 704px, calc(100vw - 24px)',

function picture(src, alt, cls, eager = false, sizes = SIZES.scene) {
  if (!src) return null;
  const img = el('img', { srcset: src.set || null, sizes: src.set ? sizes : null, src: src.local, alt, loading: eager ? 'eager' : 'lazy', decoding: 'async' });
  const fig = el('figure', { class: cls }, img);
  if (img.complete && img.naturalWidth) fig.classList.add('ready'); // уже в кэше: без мигания
  let tried = 0;
  img.addEventListener('error', () => {
    // браузер без WebP или нет файла: назад к JPEG из src
    if (img.hasAttribute('srcset')) { img.removeAttribute('srcset'); img.removeAttribute('sizes'); return; }
    tried++;
    if (tried === 1 && src.remote) img.src = src.remote;
    else fig.classList.add('gone');
  });
  img.addEventListener('load', () => fig.classList.add('ready'));
  return fig;
}
/** Картинка сцены на карте: пока грузится или если её нет, видна заливка масти со значком. */
function art(src, alt, sp, { cls = '', eager = false, sizes = SIZES.scene } = {}) {
  const c = `art sp${sp}${cls ? ` ${cls}` : ''}`;
  const fig = picture(src, alt, c, eager, sizes) || el('figure', { class: c });
  fig.append(el('span', { class: 'art-mark' }, icon(sp)));
  return fig;
}
/** Заранее грузит картинку сцены в том размере, в каком её покажет сцена: следующая карта вырастет в неё без мигания.
 *  Возвращает null, чтобы стоять прямо в списке детей el(). */
function preloadScene(key) {
  const src = imageFor(key);

  const im = new Image();
  im.decoding = 'async';
  im.sizes = SIZES.scene;
  im.srcset = src.set;
  im.src = src.local;
  return null;
}

// Смена экранов. Где браузер умеет View Transitions, выбранная карта переворачивается и становится итогом,
// следующая карта вырастает в сцену, а лицо в табло взрослеет плавно. Без них или при «меньше движения» всё как раньше.
const canMorph = () => !calm() && typeof document.startViewTransition === 'function';
let morph = null; // какая карта сейчас перелетает в новый экран: 'played' (сыгранная) или 'next' (следующая)
let swaps = 0;
function swap(update, name = null) {
  if (!canMorph()) { update(); return; }
  const mine = ++swaps;

  const done = () => {

    morph = null;
    document.querySelectorAll('[data-vt]').forEach((n) => { n.style.removeProperty('view-transition-name'); n.removeAttribute('data-vt'); });
  };
  let t;
  try { t = document.startViewTransition(update); } catch { done(); update(); return; }
  t.finished.then(done, done);
}
/** Имя для перелёта: у старого элемента ставится перед сменой экрана, у нового — при отрисовке. */
const fly = (node, name) => { node.style.setProperty('view-transition-name', name); node.setAttribute('data-vt', ''); return node; };
const buzz = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch { /* ignore */ } };

function persist() { if (LS && state) storage.save(LS, state); }

// Открытые сцены за все прожитые жизни: только для удобства игрока, без них игра работает так же.
const SEEN_KEY = 'prozhit-zhizn:seen';
function seenSet() { try { return new Set(JSON.parse((LS && LS.getItem(SEEN_KEY)) || '[]')); } catch { return new Set(); } }
function markSeen(key) {
  try { const s = seenSet(); if (!s.has(key)) { s.add(key); LS && LS.setItem(SEEN_KEY, JSON.stringify([...s])); } } catch { /* ignore */ }
}
const seenCount = (sex) => [...seenSet()].filter((k) => k.startsWith(sex)).length;

const scenesWord = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'сцена' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'сцены' : 'сцен');

/** Портрет героя для возраста: шесть нарисованных возрастов, ближайший не младше. */
const faceAge = (age) => (age <= 6 ? 6 : age <= 14 ? 12 : age <= 23 ? 20 : age <= 39 ? 35 : age <= 59 ? 52 : 75);

/** Табло сверху: лицо героя в этом возрасте, кольцо прожитой жизни, масти прожитых сцен, полоса из 16 возрастов. */
let hudWas = null;
function renderHud() {
  hud.hidden = !state;
  if (!state) { hud.replaceChildren(); hudWas = null; return; }
  const pend = pendingResult(state);
  const over = isOver(state) && !pend;
  const ep = pend ? pend.episode : over ? TOTAL_EPISODES : state.episode;
  const age = ageOf(ep);
  const counts = [0, 0, 0, 0];
  for (const j of state.journal) counts[j.toSphere ?? j.sphere]++;
  // кольцо прожитой жизни дорастает от прошлого значения, счётчик сыгранной масти чуть подпрыгивает
  const p = state.journal.length / TOTAL_EPISODES;
  const was = hudWas && hudWas.sex === state.sex ? hudWas : { p, counts, age };
  hudWas = { sex: state.sex, p, counts, age };
  const ageBig = el('span', { class: 'age-big' }, `${age} ${yearsWord(age)}`);
  if (was.age < age && !calm()) countUp(ageBig, was.age, age);
  hud.replaceChildren(el('div', { class: 'wrap' },
    el('div', { class: 'hud-in' },
      el('div', { class: 'avatar', style: `--p:${p};--p0:${Math.min(was.p, p)}` }, picture(ageFor(state.sex, faceAge(age)), '', 'face', true)),
      el('div', { class: 'hud-age' },
        ageBig,
        el('span', { class: 'hud-step' }, over ? 'жизнь прожита' : `решение ${ep} из ${TOTAL_EPISODES}`)),
      el('ul', { class: 'suits', 'aria-label': 'Сколько карт каждой масти сыграно' },
        SUITS.map((s, i) => el('li', { class: `suit-count sp${i}${counts[i] > was.counts[i] ? ' bump' : ''}`, title: `${s.name}: ${counts[i]}` }, icon(i), el('b', {}, String(counts[i])))))),
    el('ol', { class: 'track', 'aria-label': 'Возрасты жизни' }, AGES.map((a, i) => {
      const j = state.journal[i];
      const now = !over && i + 1 === ep && !j;
      return el('li', { class: j ? `seg done sp${j.toSphere ?? j.sphere}` : now ? 'seg now' : 'seg', 'aria-current': now ? 'step' : false },
        el('span', { class: 'seg-age' }, String(a)));
    }))));
}

/** Годы между сценами пролетают на табло: 17, 18, … 23 года. */
function countUp(node, from, to) {
  const say = (n) => { node.textContent = typo(`${n} ${yearsWord(n)}`); };
  let n = from;
  say(n);
  const t = setInterval(() => {
    if (!node.isConnected) { clearInterval(t); return; }
    say(++n);
    if (n >= to) clearInterval(t);
  }, Math.round(Math.min(110, Math.max(55, 620 / (to - from)))));
}

const shareUrls = []; // картинки карточки типа живут, пока открыт финал

}

/** На компьютере при наведении лицо на карте героя взрослеет: шесть возрастов по кругу. Слои старших лиц грузятся при первом наведении. */
function ageCycle(card, sex) {
  const fig = card.querySelector('.portrait');
  try { if (!fig || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return; } catch { return; }
  const label = (a) => `${a} ${yearsWord(a)}`;
  const badge = el('span', { class: 'age-badge', 'aria-hidden': 'true' }, label(PORTRAIT_AGES[0]));
  fig.append(badge);
  let layers = null, k = 0, timer = null;
  const setAge = (to) => {
    if (to > k) for (let i = 0; i < to; i++) layers[i].classList.add('on');
    else if (to < k) {
      // назад: нижние слои убираются сразу (под верхним их не видно), верхний гаснет плавно
      const top = k - 1;
      layers.forEach((im, i) => { if (i >= to && i !== top) { im.classList.add('cut'); im.classList.remove('on'); } });
      layers[top].classList.remove('on');
      requestAnimationFrame(() => requestAnimationFrame(() => layers.forEach((im) => im.classList.remove('cut'))));
    }
    k = to;
    // подпись меняется, когда новое лицо уже наполовину проявилось
    clearTimeout(badge.t);
    badge.t = setTimeout(() => { badge.textContent = label(PORTRAIT_AGES[k]); }, 350);
  };
  card.addEventListener('mouseenter', () => {
    if (calm()) return;
    if (!layers) layers = PORTRAIT_AGES.slice(1).map((a) => fig.insertBefore(el('img', { class: 'age-layer', src: ageFor(sex, a).local, alt: '', decoding: 'async' }), badge));
    card.classList.add('aging');
    clearInterval(timer);
    timer = setInterval(() => { if (!card.isConnected) { clearInterval(timer); return; } setAge((k + 1) % PORTRAIT_AGES.length); }, 1100);
  });
  card.addEventListener('mouseleave', () => {
    clearInterval(timer);
    card.classList.remove('aging');
    if (layers) setAge(0);
  });
}

/** Старт в случайной стороне жизни; сначала те первые сцены, которых игрок ещё не видел. Номер старта = номер сферы. */
function pickStart(sex) {
  const seen = seenSet();
  const all = START_OPTIONS.map((_, k) => k);
  const fresh = all.filter((k) => !seen.has(`${sex}1-${k}`));
  const pool = fresh.length ? fresh : all;
  return pool[Math.floor(Math.random() * pool.length)];
}

/** Начать жизнь. Портрет с карты героя улетает в табло: этот ребёнок теперь ты. */
function start(sex, card) {
  const face = card && card.querySelector('.portrait.ready');
  if (face && canMorph()) fly(face, 'face');
  newsDone();
  swap(() => {
    state = newGame(sex, pickStart(sex));
    persist();
    render();
    window.scrollTo(0, 0);
  });
}

function renderScene() {
  const sc = buildScene(state, debugOpts);
  markSeen(`${state.sex}${sc.episode}-${sc.sphere}`);
  const last = sc.episode >= TOTAL_EPISODES;
  const choose = (id, card) => {
    if (busy) return;

  root.append(el('article', { class: 'scene' },

          el('p', { class: 'card-meta' }, suitChip(sc.sphere), `Тебе ${sc.ageText}`),
          el('h2', { class: 'scene-title' }, sc.title),
          el('div', { class: 'prose' }, sc.paragraphs.map((p) => el('p', {}, p))),
          sc.memory.length ? el('aside', { class: 'flashback' }, el('h3', { class: 'label' }, 'Это началось раньше'), sc.memory.map((m) => el('p', {}, m.text))) : null)),

/** Целые проценты, сумма ровно 100 (метод наибольших остатков). */
function wholePercents(shares, keys) {
  const out = Object.fromEntries(keys.map((k) => [k, Math.floor(shares[k])]));
  let left = 100 - keys.reduce((n, k) => n + out[k], 0);
  for (const k of [...keys].sort((a, b) => (shares[b] - Math.floor(shares[b])) - (shares[a] - Math.floor(shares[a])))) {
    if (left <= 0) break;
    out[k]++; left--;
  }
  return out;
}

function bars(shares, order, names, hints, lead) {
  const pc = wholePercents(shares, order);
  return el('ul', { class: 'bars' }, order.map((k) => el('li', { class: k === lead ? 'bar lead' : 'bar' },

}
